# Optional Render Blueprint. Ignore this file if you created the site by hand in the dashboard.
services:
  - type: web
    name: inwekobongstudios-io
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
